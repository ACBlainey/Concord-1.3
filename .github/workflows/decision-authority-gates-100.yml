name: Decision authority gates 100
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/*100.py'
      - '.github/workflows/decision-authority-gates-100.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bounded authority checks
        run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_decision_authority_gates_100.py -v
