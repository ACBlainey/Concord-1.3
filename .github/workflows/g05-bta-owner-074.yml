name: G05 BTA Owner Boundary 074
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_bta_owner_attestation_074.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_bta_owner_attestation_074.py'
      - '.github/workflows/g05-bta-owner-074.yml'
  workflow_dispatch:
jobs:
  owner-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_bta_owner_attestation_074.py -v
