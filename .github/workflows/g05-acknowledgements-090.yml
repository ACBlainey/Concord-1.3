name: G05 Reconciliation Acknowledgements 090
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_reconciliation_acknowledgements_090.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_reconciliation_acknowledgements_090.py'
      - '.github/workflows/g05-acknowledgements-090.yml'
  workflow_dispatch:
jobs:
  acknowledgements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_reconciliation_acknowledgements_090.py -v
