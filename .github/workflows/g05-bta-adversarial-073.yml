name: G05 BTA Adversarial 073
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_bta_adversarial_073.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_bta_adversarial_073.py'
      - '.github/workflows/g05-bta-adversarial-073.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_bta_adversarial_073.py -v
