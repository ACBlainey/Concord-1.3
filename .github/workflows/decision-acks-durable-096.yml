name: Decision ACKS durable 096
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/decision_acks_durable_096.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_decision_acks_durable_096.py'
      - '.github/workflows/decision-acks-durable-096.yml'
  workflow_dispatch:
jobs:
  sqlite-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run durable local recovery tests
        run: python -m unittest discover -s '02_Domains/04_Governance/V2.1/Validation' -p 'test_decision_acks_durable_096.py' -v
