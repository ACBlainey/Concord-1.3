name: Ballot journal validation
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/*097.py'
      - '.github/workflows/decision-ballot-acks-097.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_decision_ballot_acks_097.py -v
