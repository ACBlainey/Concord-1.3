name: G05 GTP Collision 076
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_gtp_resource_collision_076.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_gtp_resource_collision_076.py'
      - '.github/workflows/g05-gtp-collision-076.yml'
  workflow_dispatch:
jobs:
  collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_gtp_resource_collision_076.py -v
