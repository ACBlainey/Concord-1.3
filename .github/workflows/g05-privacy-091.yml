name: G05 Privacy Projections 091
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_privacy_projections_091.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_privacy_projections_091.py'
      - '.github/workflows/g05-privacy-091.yml'
  workflow_dispatch:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_privacy_projections_091.py -v
