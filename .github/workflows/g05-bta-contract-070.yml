name: G05 BTA Contract 070
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/G05_BTA_Original_MRT003_Fixture_070.yaml'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_bta_contract_070.py'
      - '.github/workflows/g05-bta-contract-070.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_bta_contract_070.py -v
