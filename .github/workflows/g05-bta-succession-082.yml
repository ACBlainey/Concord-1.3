name: G05 BTA Duty Succession 082
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_bta_duty_succession_082.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_bta_duty_succession_082.py'
      - '.github/workflows/g05-bta-succession-082.yml'
  workflow_dispatch:
jobs:
  succession:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_bta_duty_succession_082.py -v
