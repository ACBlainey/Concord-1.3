name: Decision transport recovery 098
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/*098.py'
      - '.github/workflows/decision-acks-transport-098.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test separated journals
        run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_decision_acks_transport_098.py -v
