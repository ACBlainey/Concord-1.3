name: Decision external effect recovery 099
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/*099.py'
      - '.github/workflows/decision-external-effect-099.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test host crash window
        run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_decision_external_effect_099.py -v
