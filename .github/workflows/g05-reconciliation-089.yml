name: G05 Custody Reconciliation 089
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_custody_reconciliation_089.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_custody_reconciliation_089.py'
      - '.github/workflows/g05-reconciliation-089.yml'
  workflow_dispatch:
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_custody_reconciliation_089.py -v
