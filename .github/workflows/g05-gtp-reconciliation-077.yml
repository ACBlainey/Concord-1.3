name: G05 GTP Reconciliation 077
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_gtp_reconciliation_077.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_gtp_reconciliation_077.py'
      - '.github/workflows/g05-gtp-reconciliation-077.yml'
  workflow_dispatch:
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_gtp_reconciliation_077.py -v
