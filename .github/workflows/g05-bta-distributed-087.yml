name: G05 BTA Distributed Control 087
on:
  push:
    paths:
      - '02_Domains/04_Governance/V2.1/Validation/g05_bta_distributed_control_087.py'
      - '02_Domains/04_Governance/V2.1/Validation/test_g05_bta_distributed_control_087.py'
      - '.github/workflows/g05-bta-distributed-087.yml'
  workflow_dispatch:
jobs:
  distributed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 02_Domains/04_Governance/V2.1/Validation -p test_g05_bta_distributed_control_087.py -v
